
name: RaceDay Part 2 - Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.Part2.csproj

      - name: Build RaceDay API
        run: dotnet build RaceDay.Part2.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test Tests/RaceDay.Tests.csproj --configuration Release
